  <mat-card class="project-card">
  <mat-card-header>
    <div class="card-top-row">
      <span class="project-key-badge">{{ project.key }}</span>
      <span class="status-chip" [class.archived]="project.status === 'archived'">
        {{ project.status }}
      </span>
    </div>
    <mat-card-title class="project-title">{{ project.name }}</mat-card-title>
  </mat-card-header>

  <mat-card-content class="card-content">
    <p class="description">
      {{ project.description || 'No description provided.' }}
    </p>
  </mat-card-content>

  <mat-card-actions class="card-actions">
    <span class="date">Created {{ project.created_at | date:'mediumDate' }}</span>
    <div class="action-buttons">
      <button
        mat-icon-button
        class="delete-btn"
        matTooltip="Archive Project"
        (click)="onArchive($event)"
      >
        <mat-icon>delete_outline</mat-icon>
      </button>
      <button mat-button color="primary" class="open-btn" (click)="onOpen()">
        <span>Open</span>
        <mat-icon>arrow_forward</mat-icon>
      </button>
    </div>
  </mat-card-actions>
</mat-card>
