# alembic.ini
# ─────────────────────────────────────────────────────────────────────────────
# Alembic configuration file.
# This file is read by the `alembic` command-line tool.
# The actual DATABASE_URL is loaded dynamically in migrations/env.py from
# our app settings — so the sqlalchemy.url below is just a placeholder.

[alembic]
# Path to migration scripts folder
script_location = migrations

# Template used to generate migration file names
# Rev ID + timestamp + description
file_template = %%(rev)s_%%(slug)s

# Timezone for generated timestamps
timezone = UTC

# sys.path prepend — allows importing from the backend/ directory
prepend_sys_path = .

# Version location (where migration version files are stored)
version_locations = %(here)s/migrations/versions

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
